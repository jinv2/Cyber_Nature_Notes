<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>赛博自然笔记 V2.5 - 官方联动版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        :root { --glass: rgba(255, 255, 255, 0.05); }
        body { 
            background: #020617; 
            background-image: 
                radial-gradient(circle at 50% 50%, rgba(56, 189, 248, 0.08), transparent 70%),
                linear-gradient(rgba(56, 189, 248, 0.05) 1px, transparent 1px),
                linear-gradient(90deg, rgba(56, 189, 248, 0.05) 1px, transparent 1px);
            background-size: 100% 100%, 80px 80px, 80px 80px;
            min-height: 100vh; color: white; font-family: "Microsoft YaHei", sans-serif; 
            overflow-x: hidden; overflow-y: auto;
            display: flex; flex-direction: column; align-items: center;
            animation: gridPulse 20s infinite linear;
        }
        @keyframes gridPulse {
            0% { background-position: 0 0, 0 0, 0 0; }
            100% { background-position: 0 0, 80px 80px, 80px 80px; }
        }
        .glass-card { background: var(--glass); backdrop-filter: blur(25px); border: 1px solid rgba(255,255,255,0.1); border-radius: 24px; box-shadow: 0 8px 32px 0 rgba(0,0,0,0.5); }
        .logo-container { cursor: pointer; transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .logo-container:hover { transform: scale(1.1) rotate(5deg); filter: drop-shadow(0 0 15px rgba(56, 189, 248, 0.5)); }
        #chat-box::-webkit-scrollbar { width: 4px; }
        #chat-box::-webkit-scrollbar-thumb { background: rgba(56, 189, 248, 0.2); border-radius: 10px; }
        .mythic-glow { position: absolute; width: 100%; height: 100%; pointer-events: none; background: radial-gradient(60% 40% at 50% 100%, rgba(56, 189, 248, 0.08), transparent); z-index: -1; }
    </style>
</head>
<body class="p-4 md:p-8" oncontextmenu="return false;" onselectstart="return false;">
    <div class="mythic-glow"></div>

    <div class="mt-4 flex flex-col items-center">
        <a href="https://shensist.top/" title="回到神思官网" class="logo-container mb-4">
            <img src="assets/logo_ts.webp" alt="Shensist Logo" class="w-12 h-12 md:w-16 md:h-16 object-contain rounded-full border-2 border-sky-500/30">
        </a>
        <h1 class="text-xl md:text-2xl font-bold tracking-[0.3em] md:tracking-[0.4em] uppercase text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-indigo-400 text-center">赛博自然笔记</h1>
        <p class="text-[8px] md:text-[9px] opacity-40 mt-1 font-mono tracking-widest text-center">SHENSIST MATRIX PROTOCOL V2.5 // MOBILE OPTIMIZED</p>
    </div>

    <main class="glass-card w-full max-w-5xl p-6 md:p-8 flex flex-col md:flex-row gap-6 md:gap-8 mt-6">
        <div class="flex flex-col items-center gap-4 md:gap-6 md:w-1/3">
            <div id="status-display" class="w-full text-center p-3 md:p-4 rounded-xl bg-white/5 border border-white/10">
                <span class="text-[10px] text-sky-400 uppercase tracking-widest block mb-1">当前感应场景</span>
                <span id="scene-name" class="font-bold text-base md:text-lg text-white">微观地衣</span>
            </div>
            <div class="w-full space-y-2">
                <select id="scene-select" onchange="updateScene()" class="w-full bg-black/60 text-white p-3 rounded-xl border border-sky-500/30 outline-none hover:border-sky-400 transition-all cursor-pointer text-sm">
                    <option value="forest">微观森林：地衣</option>
                    <option value="ocean">深海：抹香鲸</option>
                    <option value="soil">土壤：蚯蚓</option>
                </select>
                <p class="text-[9px] opacity-40 text-center italic leading-tight">AI 遵循“无分数考核”原则，请展开你的创意想象。</p>
            </div>
        </div>

        <div class="flex-1 flex flex-col h-[320px] md:h-[400px]">
            <div id="chat-box" class="flex-1 overflow-y-auto mb-4 space-y-4 pr-2 text-xs md:text-sm">
                <div class="text-sky-300 italic mb-4 opacity-70 border-l-2 border-sky-500/30 pl-3">[系统] 场景已就绪，移动端体验已优化。</div>
            </div>
            <div class="flex flex-col sm:flex-row gap-3 bg-white/5 p-2 rounded-2xl border border-white/10 focus-within:border-sky-400/50 transition-all">
                <input type="text" id="user-input" placeholder="输入对话内容..." 
                       class="flex-1 bg-transparent border-none p-2 md:p-3 outline-none text-white placeholder:text-gray-600 text-sm">
                <button onclick="processLogic()" class="bg-gradient-to-r from-sky-600 to-indigo-600 hover:from-sky-500 hover:to-indigo-500 px-6 md:px-8 py-2 rounded-xl font-bold transition-all shadow-lg shadow-sky-950/20 text-sm">感应</button>
            </div>
        </div>
    </main>

    <footer class="mt-8 md:mt-auto mb-4 text-center">
        <div class="text-[9px] md:text-[10px] tracking-[0.1em] md:tracking-[0.2em] text-gray-400 opacity-40 uppercase">
            © 2026 <a href="https://shensist.top/" class="hover:text-sky-400 transition-colors font-bold">SHENSIST.TOP</a> 神思庭架构
            <span class="block sm:inline sm:mx-2 mt-1 sm:mt-0">|</span> 
            <span class="text-sky-400">PROPRIETARY - ALL RIGHTS RESERVED</span>
        </div>
    </footer>

    <script>
        const sceneCore = {
            forest: { name: "微观地衣", logic: [
                { keywords: ['雨', '水', '渴'], res: "雨水是宇宙的恩赐。每一滴撞击我身体的瞬间，我都在进行细胞狂欢。" },
                { keywords: ['怕', '雷', '闪电'], res: "雷声是天空的鼓点。闪电能照亮我平时的微观世界，为什么要害怕壮丽？" },
                { keywords: ['人', '分', '考'], res: "人类总在计算时间，而我只负责生长。我不懂什么是分数，我只知道风还在。" }
            ], default: "在地衣的逻辑里，沉默比解释更有力量。你能闭上眼感受一下风吗？" },
            ocean: { name: "深海抹香鲸", logic: [
                { keywords: ['深', '黑', '暗', '光'], res: "黑暗是我的温床，频率是我的眼睛。在四千米深处，灵魂是发光的。" },
                { keywords: ['孤独', '伴', '声'], res: "我的世界没有孤寂，只有共振。每一道洋流都带着星球的消息。" }
            ], default: "你听到了吗？大海的呼吸频率，远比人类的语言要深邃。" },
            soil: { name: "土壤蚯蚓", logic: [
                { keywords: ['土', '地', '钻', '呼吸'], res: "每一粒沙子都是一个星系。我在翻动土地时，正在重组世界的秩序。" },
                { keywords: ['黑暗', '下', '深'], res: "泥土之下是生命的根基。在这里，黑暗也是一种色彩。" }
            ], default: "向下看，大地母亲的脉搏就在我蠕动的节奏里。" }
        };

        function updateScene() {
            const scene = document.getElementById('scene-select').value;
            document.getElementById('scene-name').innerText = sceneCore[scene].name;
            const chatBox = document.getElementById('chat-box');
            chatBox.innerHTML += `<div class="text-center text-[10px] text-sky-500/50 my-4 tracking-widest">--- 已切换至 ${sceneCore[scene].name} ---</div>`;
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function processLogic() {
            const input = document.getElementById('user-input').value;
            if(!input) return;
            const chatBox = document.getElementById('chat-box');
            const scene = document.getElementById('scene-select').value;

            chatBox.innerHTML += `<div class="flex justify-end"><span class="bg-sky-500/10 border border-sky-500/20 p-2 md:p-3 rounded-2xl rounded-tr-none max-w-[85%] text-sky-50 text-xs md:text-sm">${input}</span></div>`;
            
            setTimeout(() => {
                let finalRes = sceneCore[scene].default;
                for(let item of sceneCore[scene].logic) {
                    if(item.keywords.some(k => input.includes(k))) { finalRes = item.res; break; }
                }
                chatBox.innerHTML += `<div class="flex justify-start flex-col">
                    <span class="text-[9px] md:text-[10px] text-sky-400 mb-1 ml-2 font-bold uppercase tracking-widest">${sceneCore[scene].name}</span>
                    <span class="bg-white/5 border border-white/5 p-2 md:p-3 rounded-2xl rounded-tl-none max-w-[90%] text-sky-50/80 leading-relaxed text-xs md:text-sm">${finalRes}</span>
                </div>`;
                chatBox.scrollTop = chatBox.scrollHeight;
                document.getElementById('user-input').value = '';
            }, 600);
        }
        
        document.getElementById('user-input').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') processLogic();
        });

        // Strict Copyright Protection
        window.addEventListener('keydown', (e) => {
            if (e.keyCode === 123 || (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) || (e.ctrlKey && e.keyCode === 85)) {
                e.preventDefault();
                return false;
            }
        });
    </script>
</body>
</html>
